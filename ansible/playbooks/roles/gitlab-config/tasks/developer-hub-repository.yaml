- name: Obtener ID del grupo 'platform-engineers' (para operaciones de proyecto)
  ansible.builtin.uri:
    url: "https://{{ gitlab_host }}/api/v4/groups?search=platform-engineers"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ generated_pat_result.json.token }}"
    return_content: true
    status_code: [200, 503]
    validate_certs: "{{ validate_ssl_certs }}"
  register: platform_engineers_group_info
  until: platform_engineers_group_info.status == 200 and platform_engineers_group_info.json | length > 0
  retries: 10
  delay: 10

- name: Buscar proyecto 'developer-hub' dentro del grupo
  ansible.builtin.uri:
    url: "https://{{ gitlab_host }}/api/v4/groups/{{ platform_engineers_group_info.json[0].id }}/projects?search=developer-hub"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ generated_pat_result.json.token }}"
    status_code: [200, 503]
    validate_certs: "{{ validate_ssl_certs }}"
  register: existing_project_lookup
  until: existing_project_lookup.status == 200
  retries: 10
  delay: 10

- name: Eliminar proyecto si ya existe
  ansible.builtin.uri:
    url: "https://{{ gitlab_host }}/api/v4/projects/{{ existing_project_lookup.json[0].id }}"
    method: DELETE
    headers:
      PRIVATE-TOKEN: "{{ generated_pat_result.json.token }}"
    status_code: [204, 404, 503]
    validate_certs: "{{ validate_ssl_certs }}"
  when: existing_project_lookup.json | length > 0
  register: deleted_project
  until: deleted_project.status in [204, 404]
  retries: 10
  delay: 10

- name: Crear proyecto 'developer-hub'
  ansible.builtin.uri:
    url: "https://{{ gitlab_host }}/api/v4/projects"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ generated_pat_result.json.token }}"
    body_format: json
    body:
      name: "developer-hub"
      path: "developer-hub"
      namespace_id: "{{ platform_engineers_group_info.json[0].id }}"
      visibility: public
      initialize_with_readme: false
    status_code: [201, 503]
    validate_certs: "{{ validate_ssl_certs }}"
  register: create_project_result
  until: create_project_result.status == 201
  retries: 10
  delay: 10
  changed_when: true

- name: Guardar ID del proyecto recién creado
  ansible.builtin.set_fact:
    developer_hub_project_id: "{{ create_project_result.json.id }}"

- name: Eliminar checkout temporal si existe
  ansible.builtin.file:
    path: /tmp/developer-hub
    state: absent

- name: Clonar repo fuente (GitHub) al checkout temporal
  ansible.builtin.git:
    repo: "{{ github_repo_url }}"
    dest: /tmp/developer-hub
    version: "{{ github_repo_branch | default('main') }}"
    force: yes
  environment:
    GIT_SSL_NO_VERIFY: "{{ 'true' if not validate_ssl_certs else 'false' }}"
  register: github_clone_result
  until: github_clone_result is succeeded
  retries: 10
  delay: 10

- name: Pinnear canal del Operator de RHDH a 1.9 (z-stream)
  ansible.builtin.lineinfile:
    path: /tmp/developer-hub/apps/developer-hub-operator/base/subscription.yaml
    regexp: '^\\s*channel:\\s*.*$'
    line: '  channel: fast-1.9'

- name: Asegurar que Subscription de RHDH no tenga 'channel' duplicado (workaround)
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - <<'PY'
    from pathlib import Path
    p = Path("/tmp/developer-hub/apps/developer-hub-operator/base/subscription.yaml")
    lines = p.read_text().splitlines()
    out = []
    seen = False
    for line in lines:
        if line.startswith("  channel:"):
            if seen:
                continue
            seen = True
            out.append("  channel: fast-1.9")
        else:
            out.append(line)
    p.write_text("\n".join(out) + "\n")
    PY
  args:
    executable: /bin/bash

- name: Mantener installPlanApproval en Automatic (sin pasos manuales)
  ansible.builtin.lineinfile:
    path: /tmp/developer-hub/apps/developer-hub-operator/base/subscription.yaml
    regexp: '^\\s*installPlanApproval:\\s*.*$'
    line: '  installPlanApproval: Automatic'

- name: Push del repo temporal al nuevo proyecto en GitLab
  ansible.builtin.shell: |
    cd /tmp/developer-hub
    git checkout -B {{ developer_hub_target_revision | default('main') }}
    git remote set-url origin https://oauth2:{{ generated_pat_result.json.token }}@{{ gitlab_host | regex_replace('^https?://', '') }}/platform-engineers/developer-hub.git
    git push origin HEAD:{{ developer_hub_target_revision | default('main') }}
    git push --tags
  environment:
    GIT_SSL_NO_VERIFY: "{{ 'true' if not validate_ssl_certs else 'false' }}"
  args:
    executable: /bin/bash
  register: git_clone_push_result
  until: git_clone_push_result.rc == 0
  retries: 10
  delay: 10
  changed_when: git_clone_push_result.rc == 0

- name: Eliminar repo local si existe
  ansible.builtin.file:
    path: "{{ local_repo_path | default('/tmp/local_developer_hub_repo') }}"
    state: absent

- name: Clonar repo GitLab
  ansible.builtin.git:
    repo: "https://oauth2:{{ generated_pat_result.json.token }}@{{ gitlab_host | regex_replace('^https?://', '') }}/platform-engineers/developer-hub.git"
    dest: "{{ local_repo_path | default('/tmp/local_developer_hub_repo') }}"
    version: "{{ developer_hub_target_revision | default('main') }}"
    force: yes
  register: git_clone_result
  until: git_clone_result is succeeded
  retries: 10
  delay: 10

- name: Pinnear canal del Operator de RHDH a 1.9 en el repo GitLab
  ansible.builtin.lineinfile:
    path: "{{ local_repo_path | default('/tmp/local_developer_hub_repo') }}/apps/developer-hub-operator/base/subscription.yaml"
    regexp: '^\\s*channel:\\s*.*$'
    line: '  channel: fast-1.9'

- name: Asegurar que Subscription de RHDH no tenga 'channel' duplicado en el repo GitLab (workaround)
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - <<'PY'
    from pathlib import Path
    p = Path("{{ local_repo_path | default('/tmp/local_developer_hub_repo') }}/apps/developer-hub-operator/base/subscription.yaml")
    lines = p.read_text().splitlines()
    out = []
    seen = False
    for line in lines:
        if line.startswith("  channel:"):
            if seen:
                continue
            seen = True
            out.append("  channel: fast-1.9")
        else:
            out.append(line)
    p.write_text("\n".join(out) + "\n")
    PY
  args:
    executable: /bin/bash

- name: Asegurar installPlanApproval Automatic en el repo GitLab
  ansible.builtin.lineinfile:
    path: "{{ local_repo_path | default('/tmp/local_developer_hub_repo') }}/apps/developer-hub-operator/base/subscription.yaml"
    regexp: '^\\s*installPlanApproval:\\s*.*$'
    line: '  installPlanApproval: Automatic'

- name: Pinnear imagen de RHDH (operand) a 1.9.x en el CR de Backstage
  ansible.builtin.lineinfile:
    path: "{{ local_repo_path | default('/tmp/local_developer_hub_repo') }}/apps/developer-hub/base/developer-hub-instance.yaml"
    insertafter: '^\\s*application:\\s*$'
    regexp: '^\\s*image:\\s*.*$'
    line: '    image: "{{ backstage_image }}"'

- name: Obtener secreto de OAuth Client desde OpenShift
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: backstage
    name: keycloak-client-secret
  register: oauth_secret
  until: oauth_secret.resources is defined and oauth_secret.resources | length > 0
  retries: 20
  delay: 10

- name: Setear valor decodificado de clientSecret para OAuth
  ansible.builtin.set_fact:
    oauth_client_secret: "{{ oauth_secret.resources[0].data.clientSecret | b64decode }}"

- name: Renderizar archivo app-config.yaml
  ansible.builtin.template:
    src: templates/app-config.yaml.j2
    dest: "{{ local_repo_path | default('/tmp/local_developer_hub_repo') }}/apps/developer-hub/overlays/dev/app-config.yaml"
    
- name: Renderizar el template.yaml de Quarkus con los valores del entorno
  ansible.builtin.template:
    src: templates/quarkus-template.yaml.j2
    dest: "{{ local_repo_path | default('/tmp/local_developer_hub_repo') }}/software-templates/quarkus-mcp-template/template.yaml"
    mode: '0644'
    lstrip_blocks: false
    trim_blocks: false

- name: "Template Quarkus: evitar conflicto ArgoCD (usar solo argocd/app-selector)"
  ansible.builtin.replace:
    path: "{{ local_repo_path | default('/tmp/local_developer_hub_repo') }}/software-templates/quarkus-mcp-template/skeleton/catalog-info.yaml"
    regexp: '^\\s*argocd/app-name:.*\\n'
    replace: ''

- name: "RBAC: corregir nombre de grupo platform-engineers (si existe typo)"
  ansible.builtin.replace:
    path: "{{ local_repo_path | default('/tmp/local_developer_hub_repo') }}/apps/developer-hub/overlays/dev/rbac-policy.yaml"
    regexp: 'group:default/platformengineers'
    replace: 'group:default/platform-engineers'

- name: "RBAC: permitir lectura de Adoption Insights (plugins/dev/platformengineer)"
  ansible.builtin.lineinfile:
    path: "{{ local_repo_path | default('/tmp/local_developer_hub_repo') }}/apps/developer-hub/overlays/dev/rbac-policy.yaml"
    insertafter: '^\\s*p, role:default/plugins, argocd\\.view\\.read, read, allow\\s*$'
    line: "{{ item }}"
  loop:
    - "    p, role:default/plugins, adoption-insights.events.read, read, allow"
    - "    p, role:default/developer, adoption-insights.events.read, read, allow"
    - "    p, role:default/platformengineer, adoption-insights.events.read, read, allow"

- name: Commit de cambios
  ansible.builtin.shell: |
    cd {{ local_repo_path | default('/tmp/local_developer_hub_repo') }}
    git config user.name "Ansible Automation"
    git config user.email "ansible-automation@{{ gitlab_host | regex_replace('^https?://', '') }}"
    git checkout -B {{ developer_hub_target_revision | default('main') }}
    git add apps/developer-hub/overlays/dev/app-config.yaml
    git add apps/developer-hub/overlays/dev/rbac-policy.yaml
    git add apps/developer-hub/base/developer-hub-instance.yaml
    git add apps/developer-hub-operator/base/subscription.yaml
    git add software-templates/quarkus-mcp-template/template.yaml
    git add software-templates/quarkus-mcp-template/skeleton/catalog-info.yaml

    if ! git diff --cached --quiet; then
      git commit -m "Update app-config.yaml and template.yaml for dev env by Ansible"
      git push origin HEAD:{{ developer_hub_target_revision | default('main') }}
    else
      echo "No changes to commit"
    fi
  args:
    executable: /bin/bash
  register: git_commit_push_result
  changed_when: "'No changes to commit' not in git_commit_push_result.stdout"
  until: git_commit_push_result.rc == 0
  retries: 10
  delay: 10