---
- name: Verificar si ya existe Secret del runner con token
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ gitlab_namespace | default('gitlab') }}"
    name: "{{ gitlab_runner_secret_name | default('gitlab-runner') }}"
  register: existing_runner_secret
  failed_when: false

- name: Capturar runner-token existente (si aplica)
  ansible.builtin.set_fact:
    gitlab_runner_token_existing: >-
      {{
        (
          existing_runner_secret.resources[0].data['runner-token']
          | default('')
          | b64decode
        ) if (existing_runner_secret.resources is defined and existing_runner_secret.resources | length > 0)
        else ''
      }}
  no_log: true

- name: Crear runner (token moderno) vinculado al usuario root (GitLab 17+)
  ansible.builtin.uri:
    url: "https://{{ gitlab_host }}/api/v4/user/runners"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ gitlab_pat }}"
    body_format: form-urlencoded
    body:
      runner_type: instance_type
      description: techdocs-runner
      tag_list: docs
      run_untagged: false
      locked: false
      access_level: not_protected
    return_content: true
    status_code: [201, 502, 503]
    validate_certs: "{{ validate_ssl_certs }}"
  register: created_runner
  until: created_runner.status == 201
  retries: 10
  delay: 10
  when: gitlab_runner_token_existing | length == 0
  no_log: true

- name: Capturar runner-token a usar
  ansible.builtin.set_fact:
    gitlab_runner_token: "{{ (gitlab_runner_token_existing if (gitlab_runner_token_existing | length > 0) else created_runner.json.token) }}"
  no_log: true

- name: Crear/actualizar Secret para registro de GitLab Runner (sin runner-token)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ gitlab_runner_secret_name | default('gitlab-runner') }}"
        namespace: "{{ gitlab_namespace | default('gitlab') }}"
      type: Opaque
      stringData:
        # En GitLab 17+ los registration tokens están deshabilitados por defecto.
        # Usamos el runner authentication token (glrt-...) creado por POST /user/runners.
        runner-registration-token: ""
        runner-token: "{{ gitlab_runner_token }}"
  no_log: true

- name: Asegurar repositorio Helm de GitLab Runner
  ansible.builtin.shell: |
    set -euo pipefail
    helm repo add gitlab https://charts.gitlab.io >/dev/null 2>&1 || true
    helm repo update >/dev/null 2>&1 || true
  args:
    executable: /bin/bash

- name: Instalar/actualizar GitLab Runner (Kubernetes executor) para TechDocs
  ansible.builtin.shell: |
    set -euo pipefail
    helm upgrade --install {{ gitlab_runner_release_name | default('gitlab-runner') }} gitlab/gitlab-runner \
      --namespace {{ gitlab_namespace | default('gitlab') }} \
      --set gitlabUrl="https://{{ gitlab_host }}/" \
      --set rbac.create=true \
      --set serviceAccount.create=true \
      --set serviceAccount.name="{{ gitlab_runner_sa_name | default('gitlab-runner') }}" \
      --set runners.secret="{{ gitlab_runner_secret_name | default('gitlab-runner') }}" \
      --set runners.tags="docs" \
      --set runners.runUntagged=false
  args:
    executable: /bin/bash

- name: Permitir anyuid SCC al ServiceAccount del runner (OpenShift)
  ansible.builtin.shell: |
    set -euo pipefail
    oc -n {{ gitlab_namespace | default('gitlab') }} adm policy add-scc-to-user anyuid -z {{ gitlab_runner_sa_name | default('gitlab-runner') }} >/dev/null 2>&1 || true
  args:
    executable: /bin/bash

- name: Esperar que el deployment del runner esté Available
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ gitlab_namespace | default('gitlab') }}"
    name: "{{ gitlab_runner_release_name | default('gitlab-runner') }}"
  register: runner_deploy
  until:
    - runner_deploy.resources is defined
    - runner_deploy.resources | length > 0
    - (runner_deploy.resources[0].status.availableReplicas | default(0) | int) >= 1
  retries: 30
  delay: 10

