- name: Install Enterprise Contract CRDs
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: enterprise-contract-crds
        namespace: openshift-gitops
      spec:
        project: default
        source:
          repoURL: "{{ gitops_repo }}"
          targetRevision: "{{ gitops_target_revision }}"
          path: apps/enterprise-contract-crds/overlays/dev
        destination:
          server: https://kubernetes.default.svc
          namespace: openshift-config
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true

- name: Deploy Enterprise Contract policies (EnterpriseContractPolicy)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: enterprise-contract-policy
        namespace: openshift-gitops
      spec:
        project: default
        source:
          repoURL: "{{ gitops_repo }}"
          targetRevision: "{{ gitops_target_revision }}"
          path: apps/enterprise-contract-policy/chart
          helm:
            parameters:
              - name: openshift_base_domain
                value: "{{ openshift_base_domain }}"
              - name: keycloak_realm
                value: "{{ keycloak_realm }}"
              - name: namespace
                value: "enterprise-contract-service"
              - name: policyName
                value: "default"
        destination:
          server: https://kubernetes.default.svc
          namespace: enterprise-contract-service
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true

