- name: Install Red Hat Trusted Profile Analyzer operator (RHTPA)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: rhtpa-operator
        namespace: "{{ argocd_namespace }}"
      spec:
        project: default
        source:
          repoURL: "{{ gitops_repo }}"
          targetRevision: "{{ gitops_target_revision }}"
          path: apps/rhtpa-operator/overlays/dev
        destination:
          server: https://kubernetes.default.svc
          namespace: trusted-profile-analyzer
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true

