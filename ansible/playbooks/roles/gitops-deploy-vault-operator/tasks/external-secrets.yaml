---
- name: "Desinstalar External Secrets community (Helm) si existe"
  ansible.builtin.command: >
    helm uninstall external-secrets -n {{ item }}
  loop:
    - vault
    - external-secrets
  register: helm_uninstall
  failed_when: false
  changed_when: "'uninstalled' in (helm_uninstall.stdout | default(''))"

- name: "Crear namespace del operador External Secrets (Red Hat)"
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ eso_operator_namespace }}"
    state: present

- name: "Crear OperatorGroup para External Secrets Operator (Red Hat)"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: "{{ eso_subscription_name }}"
        namespace: "{{ eso_operator_namespace }}"
      spec:
        targetNamespaces: []

- name: "Crear Subscription para External Secrets Operator (Red Hat)"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: "{{ eso_subscription_name }}"
        namespace: "{{ eso_operator_namespace }}"
      spec:
        channel: "{{ eso_subscription_channel }}"
        name: "{{ eso_subscription_name }}"
        source: "{{ eso_subscription_source }}"
        sourceNamespace: "{{ eso_subscription_source_namespace }}"
        installPlanApproval: Automatic

- name: "Esperar a que el CSV del operador External Secrets esté Succeeded"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ eso_operator_namespace }}"
  register: eso_csvs
  until: >
    eso_csvs.resources | selectattr('metadata.name', 'search', 'external-secrets-operator') |
    selectattr('status.phase', 'equalto', 'Succeeded') | list | length > 0
  retries: 60
  delay: 10
  changed_when: false

- name: "Configurar el operand external-secrets (ExternalSecretsConfig)"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.openshift.io/v1alpha1
      kind: ExternalSecretsConfig
      metadata:
        name: cluster
        labels:
          app.kubernetes.io/name: external-secrets-operator
      spec: {}

- name: "Esperar a que exista el namespace del operand 'external-secrets'"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ eso_namespace }}"
  register: eso_ns
  until: eso_ns.resources | length > 0
  retries: 60
  delay: 5
  changed_when: false

- name: "Esperar a que el CRD externalsecrets.external-secrets.io esté disponible"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: externalsecrets.external-secrets.io
  register: es_crd_info
  until: es_crd_info.resources is defined and es_crd_info.resources | length > 0
  retries: 60
  delay: 5
  changed_when: false

- name: "Esperar pods del operand external-secrets en Running"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ eso_namespace }}"
  register: eso_pods
  until: >
    (eso_pods.resources | length > 0) and
    (eso_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length > 0)
  retries: 60
  delay: 10
  changed_when: false