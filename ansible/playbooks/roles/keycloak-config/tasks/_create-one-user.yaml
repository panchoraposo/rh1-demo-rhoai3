- name: "Crear usuario en Keycloak ({{ kc_user.username }})"
  ansible.builtin.uri:
    url: "https://{{ keycloak_hostname }}/admin/realms/{{ keycloak_realm }}/users"
    method: POST
    headers:
      Authorization: "Bearer {{ kc_token }}"
      Content-Type: "application/json"
    body: |
      {
        "username": "{{ kc_user.username }}",
        "enabled": true,
        "email": "{{ kc_user.email }}",
        "emailVerified": true,
        "firstName": "{{ kc_user.first_name }}",
        "lastName": "{{ kc_user.last_name }}",
        "credentials": [{
          "type": "password",
          "value": "{{ kc_user.password }}",
          "temporary": false
        }]
      }
    body_format: json
    status_code: [201, 409, 401]
    validate_certs: false
  register: create_user_attempt
  failed_when: false
  retries: 3
  delay: 2
  until: create_user_attempt.status in [201, 409, 401]

- name: Refresh admin token if unauthorized creating user ({{ kc_user.username }})
  when: create_user_attempt.status == 401
  ansible.builtin.include_tasks: _refresh-admin-token.yaml

- name: "Reintentar creación de usuario ({{ kc_user.username }})"
  when: create_user_attempt.status == 401
  ansible.builtin.uri:
    url: "https://{{ keycloak_hostname }}/admin/realms/{{ keycloak_realm }}/users"
    method: POST
    headers:
      Authorization: "Bearer {{ kc_token }}"
      Content-Type: "application/json"
    body: |
      {
        "username": "{{ kc_user.username }}",
        "enabled": true,
        "email": "{{ kc_user.email }}",
        "emailVerified": true,
        "firstName": "{{ kc_user.first_name }}",
        "lastName": "{{ kc_user.last_name }}",
        "credentials": [{
          "type": "password",
          "value": "{{ kc_user.password }}",
          "temporary": false
        }]
      }
    body_format: json
    status_code: [201, 409]
    validate_certs: false
  register: create_user_retry
  failed_when: false
  retries: 10
  delay: 6
  until: create_user_retry.status in [201, 409]

- name: Fail if unable to create user ({{ kc_user.username }})
  ansible.builtin.fail:
    msg: "{{ (create_user_retry.msg if (create_user_retry is defined) else create_user_attempt.msg) | default('No se pudo crear el usuario') }}"
  when: >
    (create_user_attempt.status not in [201, 409]) and
    ((create_user_retry is not defined) or (create_user_retry.status not in [201, 409]))

