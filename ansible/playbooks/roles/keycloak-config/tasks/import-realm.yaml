- name: Verificar si el realm ya existe
  uri:
    url: "https://{{ keycloak_hostname }}/admin/realms/{{ keycloak_realm }}"
    method: GET
    headers:
      Authorization: "Bearer {{ kc_token }}"
    return_content: false
    status_code: [200, 404]
    validate_certs: false
  register: realm_exists

- name: Validar que exista el archivo del realm a importar
  when: realm_exists.status == 404
  ansible.builtin.stat:
    path: "{{ realm_json_path }}"
  register: realm_json_file

- name: Fallar si no existe el archivo del realm
  when:
    - realm_exists.status == 404
    - not realm_json_file.stat.exists
  ansible.builtin.fail:
    msg: >-
      No se encontró el archivo del realm en {{ realm_json_path }}.
      Ajusta la variable realm_json_path (vars/demo.yaml) o asegúrate de que el archivo exista en esa ruta.

- name: Importar realm
  when: realm_exists.status == 404
  uri:
    url: "https://{{ keycloak_hostname }}/admin/realms"
    method: POST
    headers:
      Authorization: "Bearer {{ kc_token }}"
    body: "{{ lookup('file', playbook_dir + '/../../backstage-realm.json') | from_json }}"
    body_format: json
    status_code: 201
    validate_certs: false