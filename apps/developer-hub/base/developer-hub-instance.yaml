apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: developer-hub
spec:
  application:
    image: "registry.redhat.io/rhdh/rhdh-hub-rhel9:1.9.1"
    extraEnvs:
      secrets:
        - name: backstage-env
    extraFiles:
      mountPath: /opt/app-root/src
      configMaps:
        - name: rbac-policies
      pvcs:
        # Persistent cache volumes (mounted only in initContainers)
        - name: rhdh-cache-dynamic-plugins
          mountPath: /var/rhdh-cache/dynamic-plugins-root
          containers:
            - install-dynamic-plugins
        - name: rhdh-cache-npm
          mountPath: /var/rhdh-cache/npmcacache
          containers:
            - install-dynamic-plugins
    dynamicPluginsConfigMapName: dynamic-plugins-rhdh
    appConfig:
      mountPath: /opt/app-root/src
      configMaps:
        - name: developer-hub-config
    replicas: 1
    route:
      enabled: true
  database:
    enableLocalDb: true
