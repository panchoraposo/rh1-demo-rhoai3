app:
  title: Red Hat Developer Hub on OpenShift

backend:
  baseUrl: https://backstage-developer-hub-backstage.${OPENSHIFT_CLUSTER_INGRESS_DOMAIN}
  listen:
    port: 7007
    host: 0.0.0.0

# --- AUTHENTICATION ---
## Development configuration
# auth:
#   providers:
#     guest:
#      dangerouslyAllowOutsideDevelopment: true

## Configuration required to enable OpenID Connect authentification
auth:
  #session:
  #  secret: ${BACKEND_SECRET}
  environment: production
  providers:
    oidc:
      production:
        prompt: auto
        metadataUrl: https://keycloak.${OPENSHIFT_CLUSTER_INGRESS_DOMAIN}/realms/backstage/.well-known/openid-configuration
        clientId: backstage
        clientSecret: ${OAUTH_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: preferredUsernameMatchingUserEntityName

signInPage: oidc

catalog:
  locations:
    - type: url
      target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/components/artist-lookup-component.yaml
    # Docs: MCP con Cursor (TechDocs)
    - type: url
      target: https://gitlab-gitlab.${OPENSHIFT_CLUSTER_INGRESS_DOMAIN}/platform-engineers/developer-hub/-/blob/rhdh-1.9-baseline/docs/mcp-cursor/catalog-info.yaml
  rules:
    - allow: [Component, System, API, Resource, Location, Template, Domain]
  
  providers:
  ## --- KEYCLOAK_CATALOG_PROVIDERS ---
    keycloakOrg:
      default:
        baseUrl: https://keycloak.${OPENSHIFT_CLUSTER_INGRESS_DOMAIN}
        loginRealm: backstage
        realm: backstage
        clientId: backstage
        clientSecret: ${OAUTH_CLIENT_SECRET}
        schedule:
          frequency: { minutes: 2 }
          timeout: { minutes: 1 }
          initialDelay: { seconds: 15}
  ## --- KEYCLOAK_CATALOG_PROVIDERS ---

## --- KEYCLOAK ---
extraEnvVars:
  - name: NODE_OPTIONS
    value: --no-node-snapshot
  - name: NODE_TLS_REJECT_UNAUTHORIZED
    value: "0"
## --- KEYCLOAK ---

## --- RBAC --- #
permission:
  enabled: true
  rbac:
    admin:
      users:
        - name: user:default/pe1
        - name: user:default/pe2
        - name: user:default/pe3
    policies-csv-file: /opt/app-root/src/rbac-policy.csv
    policyFileReload: false

scaffolder:
  enabled: true
  defaultAuthor:
    name: Red Hat Developer Hub
    email: rhdh@example.com
  templaters:
    cookiecutter:
      cookiecutterCommand: cookiecutter

techRadar:
  url: https://gitlab-gitlab.${OPENSHIFT_CLUSTER_INGRESS_DOMAIN}/platform-engineers/developer-hub/-/blob/rhdh-1.9-baseline/docs/tech-radar/radar.json

integrations:
  gitlab:
    - apiBaseUrl: https://gitlab-gitlab.${OPENSHIFT_CLUSTER_INGRESS_DOMAIN}/api/v4
      baseUrl: https://gitlab-gitlab.${OPENSHIFT_CLUSTER_INGRESS_DOMAIN}
      host: gitlab-gitlab.${OPENSHIFT_CLUSTER_INGRESS_DOMAIN}
      token: ${GITLAB_TOKEN}

#jenkins:
#  instances:
#    - name: default
#      baseUrl: https://jenkins-jenkins.${OPENSHIFT_CLUSTER_INGRESS_DOMAIN}
#      username: ${JENKINS_USER}
#      apiKey: ${JENKINS_TOKEN}

# Monta la pestaña "CD" del plugin Argo CD (frontend).
# En algunos escenarios el initContainer no fusiona `app-config.dynamic.yaml` de plugins instalados vía OCI,
# por lo que lo declaramos explícitamente acá.
dynamicPlugins:
  frontend:
    backstage-community.plugin-tekton:
      translationResources:
        - importName: tektonTranslations
          ref: tektonTranslationRef
      mountPoints:
        - mountPoint: entity.page.ci/cards
          importName: TektonCI
          config:
            layout:
              gridColumn: 1 / -1
            if:
              anyOf:
                - hasAnnotation: tekton.dev/cicd
                - hasAnnotation: janus-idp.io/tekton
    backstage-community.plugin-redhat-argocd:
      mountPoints:
        - mountPoint: entity.page.overview/cards
          importName: ArgocdDeploymentSummary
          config:
            layout:
              gridColumn: 1 / -1
            if:
              anyOf:
                - hasAnnotation: argocd/app-name
                - hasAnnotation: argocd/app-selector
        - mountPoint: entity.page.overview/cards
          importName: ArgocdDeploymentLifecycle
          config:
            layout:
              gridColumn: 1 / -1
            if:
              anyOf:
                - hasAnnotation: argocd/app-name
                - hasAnnotation: argocd/app-selector
    backstage-community.plugin-tech-radar:
      dynamicRoutes:
        - path: /tech-radar
          importName: TechRadarPage
          menuItem:
            text: Tech Radar
