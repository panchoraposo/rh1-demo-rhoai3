apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: backstage-realm
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  realm:
    realm: backstage
    enabled: true
    displayName: Backstage Realm
    groups:
      - name: developers
      - name: platform-engineers
    users:
      - username: dev1
        enabled: true
        email: dev1@example.com
        emailVerified: true
        firstName: dev1
        lastName: Backstage
        credentials:
          - type: password
            value: backstage
            temporary: false
        groups:
          - developers
      - username: dev2
        enabled: true
        email: dev2@example.com
        emailVerified: true
        firstName: dev2
        lastName: Backstage
