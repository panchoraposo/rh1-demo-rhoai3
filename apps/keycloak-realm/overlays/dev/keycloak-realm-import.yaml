        emailVerified: true
        firstName: dev3
        lastName: Backstage
        credentials:
          - type: password
            value: backstage
            temporary: false
        groups:
          - developers
      - username: pe1
        enabled: true
        email: pe1@example.com
        emailVerified: true
        firstName: pe1
        lastName: Backstage
        credentials:
          - type: password
            value: backstage
            temporary: false
        groups:
          - platform-engineers
      - username: pe2
        enabled: true
        email: pe2@example.com
        emailVerified: true
