apiVersion: v1
kind: Secret
metadata:
  name: ols-llm-credentials
  namespace: openshift-lightspeed
type: Opaque
data:
  # OpenShift Lightspeed espera la key `apitoken` para todos los providers.
  # Para `rhoai_vllm`, configura aquí el token/API key del endpoint de OpenShift AI.
  # Nota: `data` debe venir en base64. Este valor es base64("CHANGEME").
  # Si tu endpoint no exige token, igual debes enviar cualquier string.
  apitoken: ZHVtbXk=

