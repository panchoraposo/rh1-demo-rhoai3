apiVersion: ols.openshift.io/v1alpha1
kind: OLSConfig
metadata:
  name: cluster
  namespace: openshift-lightspeed
spec:
  featureGates:
    - MCPServer
  mcpServers:
    - name: kubernetes-mcp
      url: http://kubernetes-mcp-server.istio-system.svc.cluster.local:8080/mcp
      timeout: 5
  llm:
    providers:
      - name: red_hat_openshift_ai
        type: rhoai_vllm
        # Debe terminar en `/v1`. Usamos el Service interno (portable entre clusters).
        url: http://llama-32-3b-instruct-openai.my-first-model.svc.cluster.local:8080/v1
        credentialsSecretRef:
          name: ols-llm-credentials
        models:
          - name: llama-32-3b-instruct
  ols:
    defaultProvider: red_hat_openshift_ai
    defaultModel: llama-32-3b-instruct

