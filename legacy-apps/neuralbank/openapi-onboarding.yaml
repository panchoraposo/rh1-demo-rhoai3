openapi: 3.0.3
info:
  title: Neuralbank Onboarding Service API
  version: 1.0.0
  description: API para onboarding digital y alta de clientes.
servers:
  - url: https://api.neuralbank.example
paths:
  /v1/onboarding/applications:
    post:
      operationId: createOnboardingApplication
      summary: Crea una solicitud de onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOnboardingRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingApplication' }
    get:
      operationId: listOnboardingApplications
      summary: Lista solicitudes por email
      parameters:
        - in: query
          name: email
          required: true
          schema: { type: string, format: email, example: ada@neuralbank.example }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OnboardingApplication' }
  /v1/onboarding/applications/{applicationId}:
    get:
      operationId: getOnboardingApplication
      summary: Obtiene una solicitud por ID
      parameters:
        - in: path
          name: applicationId
          required: true
          schema: { type: string, example: onb_10001 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingApplication' }
components:
  schemas:
    CreateOnboardingRequest:
      type: object
      required: [fullName, email, country, product]
      properties:
        fullName: { type: string, example: Ada Lovelace }
        email: { type: string, format: email, example: ada@neuralbank.example }
        country: { type: string, example: AR }
        product:
          type: string
          enum: [CHECKING, SAVINGS]
          example: CHECKING
        marketingOptIn: { type: boolean, example: false }
    OnboardingApplication:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: string, example: onb_10001 }
        status:
          type: string
          enum: [SUBMITTED, KYC_PENDING, APPROVED, REJECTED]
          example: KYC_PENDING
        createdAt:
          type: string
          format: date-time
          example: '2026-04-09T12:10:00Z'
