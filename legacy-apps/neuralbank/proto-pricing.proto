syntax = "proto3";

package neuralbank.pricing.v1;

option java_multiple_files = true;
option java_package = "com.neuralbank.pricing.v1";
option go_package = "github.com/neuralbank/pricing/pricing/v1;pricingv1";

service PricingService {
  rpc QuoteFees(QuoteFeesRequest) returns (QuoteFeesResponse) {}
  rpc GetProductPricing(GetProductPricingRequest) returns (ProductPricing) {}
}

message Money {
  string currency = 1;
  double amount = 2;
}

message FeeLine {
  string code = 1;        // e.g. "WIRE_FEE"
  string description = 2; // e.g. "Wire transfer fee"
  Money amount = 3;
}

message QuoteFeesRequest {
  string product = 1;        // e.g. "WIRE_TRANSFER"
  string customer_segment = 2; // e.g. "RETAIL"
  Money principal = 3;
  string country = 4;
}

message QuoteFeesResponse {
  repeated FeeLine items = 1;
  Money total = 2;
  string quoted_at = 3; // RFC3339 timestamp string
}

message GetProductPricingRequest {
  string product = 1; // e.g. "CHECKING"
}

message ProductPricing {
  string product = 1;
  repeated FeeLine default_fees = 2;
  string effective_from = 3; // date string
}
