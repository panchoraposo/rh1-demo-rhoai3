apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: spring-boot-jenkins-ci
  title: Spring Boot 3 + Jenkins CI
  description: Spring Boot 3 async API (WebFlux + SSE) + Jenkins pipeline provisioning (job + first run).
  tags: [recommended, neuralbank, java, spring, spring-boot, webflux, async-api, sse, jenkins, ci]
spec:
  owner: developers
  type: service
  parameters:
    - title: Service basics
      required: [component_id, owner]
      properties:
        component_id:
          title: Name
          type: string
          default: spring-boot-jenkins
          ui:field: EntityNamePicker
        description:
          title: Description
          type: string
          default: Spring Boot 3 service with Jenkins CI
        owner:
          title: Owner
          type: string
          default: developers
    - title: Repository
      required: [repo, gitlab_group]
      properties:
        repo:
          title: Repository Location
          type: object
          properties:
            host:
              title: Repo Host
              type: string
              description: GitLab host (must match Developer Hub `integrations.gitlab[*].host`)
              default: "gitlab-gitlab.apps.ocp.mm727.sandbox944.opentlc.com"
        gitlab_group:
          title: GitLab Group
          type: string
          default: developers
    - title: GitOps & Deployment
      required: []
      properties:
        gitops_namespace:
          title: Argo CD namespace
          type: string
          default: openshift-gitops
        gitops_project:
          title: Argo CD project
          type: string
          default: default
  steps:
    - id: fetch
      name: Fetch skeleton
      action: fetch:template
      input:
        url: ./spring-boot-jenkins-ci/skeleton
        values:
          component_id: ${{ parameters.component_id }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          host: ${{ parameters.repo.host }}
          destination: ${{ parameters.gitlab_group }}/${{ parameters.component_id }}
          jenkins_job_name: ${{ parameters.component_id }}
          namespace: ${{ parameters.component_id }}-dev
          gitops_namespace: ${{ parameters.gitops_namespace }}
          gitops_project: ${{ parameters.gitops_project }}
        targetPath: ./${{ parameters.component_id }}

    - id: publish
      name: Publish
      action: publish:gitlab
      input:
        repoUrl: "${{ parameters.repo.host }}?owner=${{ parameters.gitlab_group }}&repo=${{ parameters.component_id }}"
        repoVisibility: public
        defaultBranch: main
        sourcePath: ./${{ parameters.component_id }}

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: "/catalog-info.yaml"

    - id: template-gitops-deployment
      name: Generating GitOps deployment resources
      action: fetch:template
      input:
        url: ./spring-boot-jenkins-ci/manifests
        values:
          component_id: ${{ parameters.component_id }}
          namespace: ${{ parameters.component_id }}-dev
          owner: ${{ parameters.owner }}
          gitops_namespace: ${{ parameters.gitops_namespace }}
          gitops_project: ${{ parameters.gitops_project }}
          source_repository: https://${{ parameters.repo.host }}/${{ parameters.gitlab_group }}/${{ parameters.component_id }}.git
          source_repository_gitops: https://${{ parameters.repo.host }}/${{ parameters.gitlab_group }}/${{ parameters.component_id }}-gitops.git
        targetPath: ./${{ parameters.component_id }}-gitops

    - id: publish-gitops
      name: Publishing to GitOps repository
      action: publish:gitlab
      input:
        repoUrl: "${{ parameters.repo.host }}?owner=${{ parameters.gitlab_group }}&repo=${{ parameters.component_id }}-gitops"
        repoVisibility: public
        defaultBranch: main
        sourcePath: ./${{ parameters.component_id }}-gitops

    - id: create-argocd-resources
      name: Create Argo CD Resources
      action: argocd:create-resources
      input:
        appName: ${{ parameters.component_id }}-bootstrap
        argoInstance: main
        namespace: ${{ parameters.gitops_namespace }}
        repoUrl: https://${{ parameters.repo.host }}/${{ parameters.gitlab_group }}/${{ parameters.component_id }}-gitops.git
        path: 'argocd/'

    - id: jenkins-job-create
      name: Jenkins Job Create
      action: jenkins:job:create
      input:
        jobName: ${{ parameters.component_id }}
        jobXml: |
          <flow-definition plugin="workflow-job">
            <description>CI pipeline for ${{ parameters.component_id }}</description>
            <keepDependencies>false</keepDependencies>
            <properties/>
            <definition class="org.jenkinsci.plugins.workflow.cps.CpsScmFlowDefinition" plugin="workflow-cps">
              <scm class="hudson.plugins.git.GitSCM" plugin="git">
                <configVersion>2</configVersion>
                <userRemoteConfigs>
                  <hudson.plugins.git.UserRemoteConfig>
                    <url>${{ steps.publish.output.remoteUrl }}</url>
                  </hudson.plugins.git.UserRemoteConfig>
                </userRemoteConfigs>
                <branches>
                  <hudson.plugins.git.BranchSpec>
                    <name>*/main</name>
                  </hudson.plugins.git.BranchSpec>
                </branches>
                <doGenerateSubmoduleConfigurations>false</doGenerateSubmoduleConfigurations>
                <submoduleCfg class="empty-list"/>
                <extensions/>
              </scm>
              <scriptPath>Jenkinsfile</scriptPath>
              <lightweight>true</lightweight>
            </definition>
            <triggers/>
            <disabled>false</disabled>
          </flow-definition>

    - id: jenkins-job-build
      name: Jenkins Job Build
      action: jenkins:job:build
      input:
        jobName: ${{ parameters.component_id }}

  output:
    links:
      - title: Source Code Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open Component in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
---
