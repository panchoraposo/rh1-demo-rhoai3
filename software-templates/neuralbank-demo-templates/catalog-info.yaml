apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: neuralbank-ai-assistant-api
  title: Neuralbank AI Assistant API
  description: AI Assistant API (Python/FastAPI) para Neuralbank.
  tags: [recommended, neuralbank, ai, python]
spec:
  owner: developers
  type: service
  parameters:
    - title: Service basics
      required: [component_id, owner]
      properties:
        component_id:
          title: Name
          type: string
          default: neuralbank-ai-assistant
          ui:field: EntityNamePicker
        description:
          title: Description
          type: string
          default: Neuralbank AI Assistant API
        owner:
          title: Owner
          type: string
          default: developers
  steps:
    - id: fetch
      name: Fetch skeleton
      action: fetch:template
      input:
        url: ./neuralbank-ai-assistant-api/skeleton
        values:
          component_id: ${{ parameters.component_id }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
---
