apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ${{ values.component_id }}
  labels:
    app.kubernetes.io/name: ${{ values.component_id }}
    backstage.io/kubernetes-id: ${{ values.component_id }}
    app.openshift.io/runtime: spring-boot
    app.kubernetes.io/part-of: ${{ values.component_id }}
spec:
  successfulBuildsHistoryLimit: 5
  failedBuildsHistoryLimit: 5
  resources: {}
  postCommit: {}
  nodeSelector: null
  output:
    to:
      kind: ImageStreamTag
      name: ${{ values.component_id }}:latest
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: ${{ values.source_repository }}
      ref: main
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: ImageStreamTag
        name: java:openjdk-17-ubi8
        namespace: openshift
  triggers: []

