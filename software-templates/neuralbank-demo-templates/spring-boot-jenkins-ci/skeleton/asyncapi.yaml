asyncapi: 2.6.0
info:
  title: NeuralBank Payments Async API
  version: 1.0.0
  description: |
    Demo async API for the Payments workflow.

    This template accepts async payment submissions over HTTP and emits lifecycle events over Server-Sent Events (SSE).
servers:
  http:
    url: /
    protocol: http
    description: HTTP server hosting the SSE event stream
channels:
  /api/payments:
    description: Submit a payment for async processing (HTTP POST)
    publish:
      operationId: submitPayment
      message:
        $ref: '#/components/messages/PaymentRequest'

  /api/payments/{paymentId}:
    description: Read the current payment status (HTTP GET)
    subscribe:
      operationId: getPaymentStatus
      message:
        $ref: '#/components/messages/PaymentStatus'

  /api/payments/{paymentId}/events:
    description: Stream payment lifecycle events (SSE)
    parameters:
      paymentId:
        description: Payment identifier
        schema:
          type: string
    subscribe:
      operationId: streamPaymentEvents
      message:
        oneOf:
          - $ref: '#/components/messages/PaymentAccepted'
          - $ref: '#/components/messages/PaymentProcessing'
          - $ref: '#/components/messages/RiskScored'
          - $ref: '#/components/messages/PaymentDecided'
          - $ref: '#/components/messages/PaymentCompleted'
components:
  messages:
    PaymentRequest:
      name: PAYMENT_REQUEST
      title: Payment request
      payload:
        $ref: '#/components/schemas/PaymentRequest'
    PaymentStatus:
      name: PAYMENT_STATUS
      title: Payment status
      payload:
        $ref: '#/components/schemas/PaymentStatus'
    PaymentAccepted:
      name: PAYMENT_ACCEPTED
      title: Payment accepted
      payload:
        $ref: '#/components/schemas/PaymentAcceptedEvent'
    PaymentProcessing:
      name: PAYMENT_PROCESSING
      title: Payment processing
      payload:
        $ref: '#/components/schemas/PaymentProcessingEvent'
    RiskScored:
      name: RISK_SCORED
      title: Risk scored
      payload:
        $ref: '#/components/schemas/RiskScoredEvent'
    PaymentDecided:
      name: PAYMENT_DECIDED
      title: Payment decided
      payload:
        $ref: '#/components/schemas/PaymentDecidedEvent'
    PaymentCompleted:
      name: PAYMENT_COMPLETED
      title: Payment completed
      payload:
        $ref: '#/components/schemas/PaymentCompletedEvent'
  schemas:
    PaymentRequest:
      type: object
      required: [customerId, currency, amount]
      properties:
        customerId:
          type: string
        currency:
          type: string
          description: ISO currency code
          example: CLP
        amount:
          type: number
          format: double
        reference:
          type: string
    PaymentStatus:
      type: object
      required: [id, state, updatedAt]
      properties:
        id:
          type: string
        state:
          type: string
          enum: [ACCEPTED, PROCESSING, COMPLETED]
        updatedAt:
          type: string
          format: date-time
        decision:
          type: string
          enum: [APPROVED, REVIEW, DECLINED]
          nullable: true
        riskLevel:
          type: string
          enum: [LOW, MEDIUM, HIGH, UNKNOWN]
          nullable: true
    BaseEvent:
      type: object
      required: [type, paymentId, at, data]
      properties:
        type:
          type: string
        paymentId:
          type: string
        at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
    PaymentAcceptedEvent:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            type:
              type: string
              enum: [PAYMENT_ACCEPTED]
            data:
              type: object
              required: [customerId, amount, currency]
              properties:
                customerId: { type: string }
                amount: { type: number, format: double }
                currency: { type: string }
                reference: { type: string }
    PaymentProcessingEvent:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            type:
              type: string
              enum: [PAYMENT_PROCESSING]
            data:
              type: object
              properties:
                step: { type: string }
    RiskScoredEvent:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            type:
              type: string
              enum: [RISK_SCORED]
            data:
              type: object
              properties:
                riskLevel:
                  type: string
                  enum: [LOW, MEDIUM, HIGH, UNKNOWN]
    PaymentDecidedEvent:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            type:
              type: string
              enum: [PAYMENT_DECIDED]
            data:
              type: object
              properties:
                decision:
                  type: string
                  enum: [APPROVED, REVIEW, DECLINED]
                riskLevel:
                  type: string
                  enum: [LOW, MEDIUM, HIGH, UNKNOWN]
    PaymentCompletedEvent:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            type:
              type: string
              enum: [PAYMENT_COMPLETED]
            data:
              type: object
              properties:
                status:
                  type: string
                  enum: [APPROVED, REVIEW, DECLINED]

