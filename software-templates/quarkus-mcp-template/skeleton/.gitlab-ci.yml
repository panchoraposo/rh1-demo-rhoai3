stages:
  - techdocs

techdocs:
  stage: techdocs
  image: python:3.12-slim
  tags:
    - docs
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_NO_CACHE_DIR: "1"
  script:
    - python -V
    - pip install --no-cache-dir mkdocs mkdocs-techdocs-core
    - |
      if [ -f "mkdocs.yml" ]; then
        MKDOCS_FILE="mkdocs.yml"
      elif [ -f "mkdocs.yaml" ]; then
        MKDOCS_FILE="mkdocs.yaml"
      elif [ -f "docs/mkdocs.yml" ]; then
        MKDOCS_FILE="docs/mkdocs.yml"
      elif [ -f "docs/mkdocs.yaml" ]; then
        MKDOCS_FILE="docs/mkdocs.yaml"
      else
        echo "No mkdocs config file found (mkdocs.yml|mkdocs.yaml)."
        exit 1
      fi
    - mkdocs build -f "$MKDOCS_FILE" -d site
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - site/
