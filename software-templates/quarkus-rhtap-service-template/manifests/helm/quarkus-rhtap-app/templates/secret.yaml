{{- if and (eq .Values.image.registry "Quay") .Values.imagePullSecrets.enabled .Values.imagePullSecrets.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecrets.name }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{
    printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}"
      .Values.image.host
      .Values.image.organization
      .Values.image.password
      (printf "%s:%s" .Values.image.organization .Values.image.password | b64enc)
    | b64enc
  }}
{{- end }}

