apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: git-token-external
spec:
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: git-token
  data:
    - secretKey: token
      remoteRef:
        key: secrets/rhdh/gitlab
        property: token

