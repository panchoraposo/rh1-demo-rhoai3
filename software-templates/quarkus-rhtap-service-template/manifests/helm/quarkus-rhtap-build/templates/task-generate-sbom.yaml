apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: generate-sbom
spec:
  params:
    - name: IMAGE_URL
      type: string
    - name: IMAGE_DIGEST
      type: string
    - name: SYFT_IMAGE
      type: string
      default: anchore/syft:v1.10.0
  results:
    - name: SBOM_PATH
      type: string
  workspaces:
    - name: source
  steps:
    - name: sbom
      image: $(params.SYFT_IMAGE)
      workingDir: $(workspaces.source.path)
      script: |
        set -euo pipefail
        IMG="$(params.IMAGE_URL)@$(params.IMAGE_DIGEST)"
        OUT="sbom.cdx.json"
        syft "$IMG" -o cyclonedx-json > "$OUT"
        printf "%s" "$OUT" > "$(results.SBOM_PATH.path)"

