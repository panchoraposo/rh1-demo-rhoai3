apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: quarkus-rhtap-service-template
  title: Quarkus Service + RHTAP (Trusted Supply Chain)
  description: Quarkus REST service scaffold with Tekton CI, GitOps (Argo CD), and RHTAP-oriented supply chain gates.
  tags:
    - recommended
    - java
    - quarkus
    - tekton
    - gitops
    - rhtap
spec:
  owner: developers
  type: service

  parameters:
    - title: Service basics
      required: [component_id, java_package_name, owner]
      properties:
        component_id:
          title: Name
          type: string
          description: Unique name of the component
          ui:field: EntityNamePicker
          maxLength: 25
          default: quarkus-rhtap-service
        description:
          title: Description
          type: string
          default: Quarkus REST service with a trusted supply chain
        java_package_name:
          title: Java package name
          type: string
          default: com.neuralbank
          description: eg (com.neuralbank.orders)
        owner:
          title: Owner
          type: string
          description: Owner of the component
          ui:field: OwnerPicker
          ui:options:
            allowedKinds: [Group]
          default: group:default/developers

    - title: Image registry
      required: [image_registry]
      properties:
        image_registry:
          title: Image registry
          type: string
          enum: [OpenShift, Quay]
      dependencies:
        image_registry:
          oneOf:
            - properties:
                image_registry:
                  enum: [OpenShift]
                image_host:
                  title: Image host
                  type: string
                  default: image-registry.openshift-image-registry.svc:5000
                image_tag:
                  title: Initial image tag
                  type: string
                  default: latest
            - properties:
                image_registry:
                  enum: [Quay]
                image_host:
                  title: Image host
                  type: string
                  default: quay.apps.ocp.mm727.sandbox944.opentlc.com
                image_organization:
                  title: Quay organization
                  type: string
                  default: quayadmin
                image_tag:
                  title: Initial image tag
                  type: string
                  default: latest

    - title: GitLab repositories
      required: [repo, gitlab_group]
      properties:
        repo:
          title: Repository location
          type: object
          properties:
            host:
              title: Repo host
              type: string
              description: GitLab host (must match Developer Hub integrations.gitlab[*].host)
              default: gitlab-gitlab.apps.ocp.mm727.sandbox944.opentlc.com
        gitlab_group:
          title: GitLab group
          type: string
          default: developers
          description: The GitLab group/namespace where repos will be created.

    - title: GitOps & deployment
      required: []
      properties:
        gitops_namespace:
          title: Argo CD namespace
          type: string
          default: openshift-gitops
        gitops_project:
          title: Argo CD project
          type: string
          default: default
        cluster_subdomain:
          title: Cluster apps subdomain
          type: string
          default: apps.ocp.mm727.sandbox944.opentlc.com

  steps:
    - id: fetch
      name: Fetch skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: ${{ parameters.component_id }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          namespace: ${{ parameters.component_id }}-dev
          host: ${{ parameters.repo.host }}
          destination: ${{ parameters.gitlab_group }}/${{ parameters.component_id }}
          java_package_name: ${{ parameters.java_package_name }}
          image_registry: ${{ parameters.image_registry }}
          image_host: ${{ parameters.image_host }}
          image_organization: ${{ parameters.image_organization }}
          image_tag: ${{ parameters.image_tag }}
          gitops_namespace: ${{ parameters.gitops_namespace }}
          cluster_subdomain: ${{ parameters.cluster_subdomain }}
        targetPath: ./${{ parameters.component_id }}

    - id: publish
      name: Publish
      action: publish:gitlab
      input:
        repoUrl: "${{ parameters.repo.host }}?owner=${{ parameters.gitlab_group }}&repo=${{ parameters.component_id }}"
        repoVisibility: public
        defaultBranch: main
        sourcePath: ./${{ parameters.component_id }}

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: "/catalog-info.yaml"

    - id: template-gitops
      name: Generate GitOps repo
      action: fetch:template
      input:
        url: ./manifests
        values:
          component_id: ${{ parameters.component_id }}
          namespace: ${{ parameters.component_id }}-dev
          owner: ${{ parameters.owner }}
          gitops_namespace: ${{ parameters.gitops_namespace }}
          gitops_project: ${{ parameters.gitops_project }}
          repository_host: ${{ parameters.repo.host }}
          source_repository: https://${{ parameters.repo.host }}/${{ parameters.gitlab_group }}/${{ parameters.component_id }}.git
          source_repository_gitops: https://${{ parameters.repo.host }}/${{ parameters.gitlab_group }}/${{ parameters.component_id }}-gitops.git
          image_registry: ${{ parameters.image_registry }}
          image_host: ${{ parameters.image_host }}
          image_organization: ${{ parameters.image_organization }}
          image_password: backstage
          image_name: ${{ parameters.component_id }}
          image_tag: ${{ parameters.image_tag }}
          cluster_subdomain: ${{ parameters.cluster_subdomain }}
          port: 8080
        targetPath: ./${{ parameters.component_id }}-gitops

    - id: publish-gitops
      name: Publish GitOps repository
      action: publish:gitlab
      input:
        repoUrl: "${{ parameters.repo.host }}?owner=${{ parameters.gitlab_group }}&repo=${{ parameters.component_id }}-gitops"
        repoVisibility: public
        defaultBranch: main
        sourcePath: ./${{ parameters.component_id }}-gitops

    - id: create-argocd
      name: Create Argo CD resources
      action: argocd:create-resources
      input:
        appName: ${{ parameters.component_id }}-bootstrap
        argoInstance: main
        namespace: ${{ parameters.gitops_namespace }}
        repoUrl: https://${{ parameters.repo.host }}/${{ parameters.gitlab_group }}/${{ parameters.component_id }}-gitops.git
        path: "argocd/"

  output:
    links:
      - title: Source Code Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: GitOps Repository
        url: ${{ steps.publish-gitops.output.remoteUrl }}
      - title: Open Component in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
